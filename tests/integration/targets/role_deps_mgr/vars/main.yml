---
deps_mgr_list:
  Debian:
    packages:
      - hello-traditional
      - name: hello
        state: absent
      # Regression check: this must never leak through as a package name.
      - "{{ (1 == 2) | ansible.builtin.ternary('this-package-does-not-exist', omit) }}"
    Ubuntu:
      repositories:
        - repo_type: apt
          name: "deb http://archive.ubuntu.com/ubuntu {{ ansible_facts['distribution_release'] }} universe"
          state: present
      packages:
        - hello
