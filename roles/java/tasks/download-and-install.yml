---
- name: Gather Required Facts if Missing
  when: ansible_facts['system'] is not defined
        or ansible_facts['architecture'] is not defined
        or ansible_facts['os_family'] is not defined
        or ansible_facts['pkg_mgr'] is not defined
  ansible.builtin.setup:
    gather_subset: ['platform', 'distribution', 'pkg_mgr']

# Vendors only publish these downloads for glibc-based Linux.
- name: Assert Host Supports Archive Installs
  ansible.builtin.assert:
    that:
      - ansible_facts['system'] == 'Linux'
      - ansible_facts['os_family'] != 'Alpine'
    fail_msg: >-
      {{ java_vendor }} {{ java_variant }} is only available as a download for glibc-based Linux,
      not {{ ansible_facts['distribution'] }}.
    quiet: true

- name: Ensure Download Directory Exists
  become: true
  ansible.builtin.file:
    path: "{{ java_archive_download_dir }}"
    state: directory
    owner: root
    group: root
    mode: "u=rwx,g=rx,o=rx"

# Download and verify archive-based installs. The archive is kept so that later runs can skip the
# download when the checksum still matches.
# See: https://www.oracle.com/java/technologies/jdk-script-friendly-urls/
- name: Download {{ java_vendor ~ ' ' ~ java_variant ~ ' Java ' ~ java_version }}
  become: true
  ansible.builtin.get_url:
    url: "{{ java_archives[java_vendor][java_variant]['url'] }}"
    checksum: "{{ java_archives[java_vendor][java_variant]['checksum'] }}"
    dest: "{{ java_archive_path }}"
    owner: root
    group: root
    mode: u=rw,g=r,o=r

# For Package-based installations/upgrades. apt only installs local files through its deb option.
- name: Install {{ java_vendor ~ ' ' ~ java_variant ~ ' Java ' ~ java_version ~ ' from Debian Package' }}
  when:
    - (java_archive_path | ansible.builtin.splitext)[1] not in java_archive_exts
    - ansible_facts['pkg_mgr'] == 'apt'
  become: true
  ansible.builtin.apt:
    deb: "{{ java_archive_path }}"

- name: Install {{ java_vendor ~ ' ' ~ java_variant ~ ' Java ' ~ java_version ~ ' from Package' }} # noqa: package-latest
  when:
    - (java_archive_path | ansible.builtin.splitext)[1] not in java_archive_exts
    - ansible_facts['pkg_mgr'] != 'apt'
  become: true
  ansible.builtin.package:
    name: "{{ java_archive_path }}"
    state: latest

# For Archive-based installations
- name: Install {{ java_vendor ~ ' ' ~ java_variant ~ ' Java ' ~ java_version ~ ' from Archive' }}
  when: (java_archive_path | ansible.builtin.splitext)[1] in java_archive_exts
  become: true
  block:
    - name: Migrate Legacy Install Directory
      ansible.builtin.include_tasks:
        file: migrate-legacy-install.yml
    - name: Ensure Destination Directory Exists
      ansible.builtin.file:
        path: "{{ java_install_directory }}"
        state: directory
        owner: root
        group: root
        mode: "u=rwx,g=rx,o=rx"
    # Archives contain a single top-level directory (e.g. graalvm-jdk-25.0.1+8.1/), which is stripped
    # so that the JDK lands directly in java_install_directory.
    - name: Extract {{ java_vendor ~ ' ' ~ java_variant ~ ' Java ' ~ java_version }}
      ansible.builtin.unarchive:
        src: "{{ java_archive_path }}"
        dest: "{{ java_install_directory }}"
        remote_src: true
        extra_opts: ['--strip-components=1']
        owner: root
        group: root
        mode: "u=rwX,g=rX,o=rX"
    - name: Update Alternatives - jre_{{ java_version }}
      when: java_update_alternatives | default(false)
      community.general.alternatives:
        name: "jre_{{ java_version }}"
        path: "{{ java_install_directory }}"
        link: "/usr/lib/jvm/jre_{{ java_version }}"
    - name: Update Alternatives - java_sdk_{{ java_version }}
      when:
        - java_update_alternatives | default(false)
        - java_type == 'jdk'
      community.general.alternatives:
        name: "java_sdk_{{ java_version }}"
        path: "{{ java_install_directory }}"
        link: "/usr/lib/jvm/java_sdk_{{ java_version }}"
    # A single task is used because each call replaces the full subcommand list for the path.
    - name: Update Alternatives - java
      when: java_update_alternatives | default(false)
      community.general.alternatives:
        name: java
        path: "{{ (java_install_directory, 'bin', 'java') | ansible.builtin.path_join }}"
        link: /usr/bin/java
        state: auto
        subcommands: "{{ java_alt_jre_subcommands + (java_type == 'jdk') | ansible.builtin.ternary(java_alt_jdk_subcommands, []) }}"
      vars:
        java_alt_jre_subcommands:
          - name: jre
            link: "{{ (java_install_directory | ansible.builtin.normpath | ansible.builtin.dirname, 'jre') | ansible.builtin.path_join }}"
            path: "{{ java_install_directory }}"
          - name: alt-java
            link: /usr/bin/alt-java
            path: "{{ (java_install_directory, 'bin', 'alt-java') | ansible.builtin.path_join }}"
          - name: keytool
            link: /usr/bin/keytool
            path: "{{ (java_install_directory, 'bin', 'keytool') | ansible.builtin.path_join }}"
        java_alt_jdk_subcommands:
          - name: jcmd
            link: /usr/bin/jcmd
            path: "{{ (java_install_directory, 'bin', 'jcmd') | ansible.builtin.path_join }}"
          - name: rmiregistry
            link: /usr/bin/rmiregistry
            path: "{{ (java_install_directory, 'bin', 'rmiregistry') | ansible.builtin.path_join }}"
